[project]
name = "titan-server"
version = "0.1.0"
description = "The TITAN API and worker that run on the node."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "claude-agent-sdk>=0.2.157",
    "fastapi",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn",
]

[project.scripts]
titan-admin = "titan_server.admin:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
