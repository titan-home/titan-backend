# Development stack: api built from source and PostgreSQL. The node's own
# compose file lives in titan-node and pulls published images by digest.

services:
  api:
    build: .
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Applies pending migrations, then exits; the api starts only after it.
  migrate:
    build: .
    command: ["titan-admin", "migrate"]
    read_only: true
    mem_limit: 256m
    environment:
      TITAN_DATABASE_URL: postgresql+psycopg://titan@db/titan
      TITAN_DATABASE_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
    mem_limit: 1g
    environment:
      POSTGRES_USER: titan
      POSTGRES_DB: titan
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [db-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "titan", "-d", "titan"]
      interval: 5s
      timeout: 3s
      retries: 10

secrets:
  db_password:
    file: .secrets/db_password

volumes:
  db-data:
