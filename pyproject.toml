# The uv workspace: a package per node process, titan-api and titan-admin,
# each on the shared titan-core; titan-cli runs on the owner's machines
# (decision #85).
[tool.uv.workspace]
members = ["server/core", "server/api", "server/admin", "cli"]

[tool.uv]
# New versions wait 14 days before we take them (development rules, section 11).
exclude-newer = "14 days"

[dependency-groups]
dev = ["httpx", "mypy", "openapi-python-client", "pytest", "ruff"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["shared", "cli/src/titan_cli/client"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["titan_core", "titan_api", "titan_admin", "titan_cli"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
strict = true
# --strict leaves out the check for a variable that may be unset.
enable_error_code = ["possibly-undefined"]
files = ["server", "cli"]
mypy_path = ["server/core/src", "server/api/src", "server/admin/src", "cli/src"]
explicit_package_bases = true

# The API client is generated (decision #93); its own code is not ours to fix,
# but every use of it is still type-checked.
[[tool.mypy.overrides]]
module = "titan_cli.client.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["server/core/tests", "server/api/tests", "server/admin/tests", "cli/tests"]
addopts = ["--import-mode=importlib"]


# Alembic for development: `uv run alembic revision --autogenerate -m "..."`.
# The node runs migrations with `titan-admin migrate`, which needs no config
# file (see titan_core.db.alembic_config).
[tool.alembic]
script_location = "%(here)s/server/core/src/titan_core/migrations"
# The date sorts the files by creation; the order of applying them comes
# from down_revision inside each file.
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"

[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"
