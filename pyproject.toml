# The uv workspace: titan-server runs on the node, titan-cli on the owner's
# machines (decision #85).
[tool.uv.workspace]
members = ["server", "cli"]

[tool.uv]
# New versions wait 14 days before we take them (development rules, section 11).
exclude-newer = "14 days"

[dependency-groups]
dev = ["httpx", "mypy", "pytest", "ruff"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["shared"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["titan_server", "titan_cli"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["server", "cli"]
mypy_path = ["server/src", "cli/src"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["server/tests", "cli/tests"]
addopts = ["--import-mode=importlib"]


# Alembic for development: `uv run alembic revision --autogenerate -m "..."`.
# The node runs migrations with `titan-admin migrate`, which needs no config
# file (see titan_server.db.alembic_config).
[tool.alembic]
script_location = "%(here)s/server/src/titan_server/migrations"

[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"
