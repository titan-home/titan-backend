# Dependency updates (decision #95): every new version waits 14 days, like
# uv's exclude-newer in pyproject.toml; security updates come at once.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  # The base images in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    # The backend stays on Python 3.12 until the owner decides otherwise.
    ignore:
      - dependency-name: python
        versions: [">=3.13"]
  # The PostgreSQL image of the development stack.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
