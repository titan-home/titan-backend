name: checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # The same image as compose.yaml
        image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
        env:
          POSTGRES_PASSWORD: test
        ports: ["55432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TITAN_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@127.0.0.1:55432/postgres
    steps:
      - name: Check out the repository with shared/
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0 # full history, also for shared/, so the ancestor check sees it
      - name: Check that shared/ points to a commit on titan-shared's master
        run: |
          git -C shared fetch origin master
          git -C shared merge-base --is-ancestor HEAD origin/master
      - name: Check relative links
        run: python3 shared/scripts/check_links.py .
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17" # the same uv as in the Dockerfile, at least 14 days old
      - name: Install dependencies from the lock file
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Check types
        run: uv run mypy
      - name: Run tests
        run: uv run pytest
      - name: Start the stack and wait until it is healthy
        run: |
          mkdir -m 700 .secrets
          openssl rand -hex 32 > .secrets/db_password
          chmod 644 .secrets/db_password
          # No chat runs here, so the token file stays empty.
          touch .secrets/claude_token
          docker compose up --build --wait
          curl --fail --silent http://127.0.0.1:8000/health
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
